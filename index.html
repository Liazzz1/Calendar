       <div className=${'text-[11px] font-semibold leading-tight '+(t.done?'line-through':'')}>${t.title}</div><div className="text-[10px] text-[#6B7280]">${tf(t.start)}–${tf(t.start+t.dur)}</div></div>`)}</div>`})}
     ${showNow&&html`<div className="absolute h-px bg-[#EF4444] pointer-events-none z-10" style=${{top:(nm-S*60)/60*H,left:44,right:0}}></div>`}
    </div></div></div>
  <button onClick=${()=>newT({date:sel})} className="absolute right-3 bottom-3 w-12 h-12 rounded-full bg-[#111C33] text-white grid place-items-center shadow-lg z-40"><${Ic} n="plus" s=${22}/></button>
 </div>
 <div data-flex="1" className=${'shrink-0 border-t border-[#E5E9F0] px-3 pt-2 transition-colors '+(overFlex?'bg-blue-50':'bg-[#F6F8FA]')} style=${{paddingBottom:8}}>
  <div className="flex items-center justify-between mb-2"><b className="text-[13px]">${L('flex')} <span className="text-gray-400 font-normal">(${nflex})</span> <span className="text-[11px] text-gray-400 font-normal">· ${L('holdhint')}</span></b><button onClick=${()=>setCol(!col)} className="p-1 text-gray-500" style=${{transform:col?'rotate(-90deg)':'rotate(90deg)'}}><${Ic} n="r" s=${16}/></button></div>
  ${!col&&html`<div className="mb-2">${FlexInput}</div>
  <div className="flex gap-2 overflow-x-auto pb-1" style=${{minHeight:70}}>${flex.length?flex.map(t=>html`<div key=${t.id} onPointerDown=${e=>begin(e,t,()=>setModal({t}))} onContextMenu=${nc} className=${'shrink-0 w-[150px] bg-white border border-[#E5E9F0] shadow-sm rounded-lg flex overflow-hidden '+(g&&g.t.id===t.id?'opacity-40':'')} style=${ns}><div style=${{width:4,background:C[PC[t.pri]][1]}}></div><div className="p-2 min-w-0 flex-1"><div className="text-[12px] font-semibold leading-tight line-clamp-2">${t.title}</div><div className="mt-1.5 flex items-center justify-between"><${Badge} p=${t.pri}/></div>${t.due&&html`<div className="text-[10px] text-[#6B7280] mt-1">${dueTxt(t.due)}</div>`}</div></div>`):html`<div className="text-[12px] text-gray-400 py-4">${L('flexempty')}</div>`}</div>`}
 </div>
 ${g&&html`<div className="fixed z-[60] pointer-events-none rounded-md px-2 py-1 shadow-xl" style=${{left:g.x-55,top:g.y-30,width:110,background:DARK?'#243044':bgc(PC[g.t.pri]),borderLeft:'4px solid '+C[PC[g.t.pri]][1]}}><div className="text-[11px] font-semibold leading-tight">${g.t.title}</div><div className="text-[10px] font-medium text-[#111C33]">${g.h?(g.h.date?DN[(parse(g.h.date).getDay()+6)%7]+' '+tf(g.h.start):L('toflexlow')):'—'}</div></div>`}
 ${modalEl}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
